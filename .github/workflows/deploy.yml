name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-pihole-agent
  cancel-in-progress: false

jobs:
  # Tests run on GitHub-hosted runners, so pull requests (including from forks) never touch
  # your self-hosted runner.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build --pull --build-arg PATCHED_AT="$(date -u +%s)" --build-arg REVISION="$GITHUB_SHA" -t pihole-agent:ci .

  # Deploys only from main, never for pull requests, and only once AGENT_HOST is configured
  # (see README: Secrets and variables), so a fresh clone doesn't queue jobs for a missing runner.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AGENT_HOST != ''
    runs-on: [self-hosted, proxmox]
    env:
      AGENT_HOST: ${{ vars.AGENT_HOST }}
      AGENT_NAME: pihole-agent
    steps:
      - uses: actions/checkout@v5

      - name: Render agent.env
        env:
          PRIMARY_URL: ${{ vars.PRIMARY_URL }}
          SECONDARY_HOST: ${{ vars.SECONDARY_HOST }}
          SECONDARY_HOST_KEY: ${{ vars.SECONDARY_HOST_KEY }}
          CHECK_HOUR: ${{ vars.CHECK_HOUR }}
          DEAD_AFTER_DAYS: ${{ vars.DEAD_AFTER_DAYS }}
          ABANDONED_AFTER_DAYS: ${{ vars.ABANDONED_AFTER_DAYS }}
          PIHOLE_PASSWORD: ${{ secrets.PIHOLE_PASSWORD }}
          NOTIFY_URLS: ${{ secrets.NOTIFY_URLS }}
        run: |
          for v in PRIMARY_URL SECONDARY_HOST SECONDARY_HOST_KEY PIHOLE_PASSWORD NOTIFY_URLS; do
            [ -n "${!v}" ] || { echo "::error::$v is required"; exit 1; }
          done
          mkdir -p stage/context
          cp -r pihole_agent requirements.txt Dockerfile .dockerignore stage/context/
          (umask 077; : > stage/agent.env)
          for v in PRIMARY_URL SECONDARY_HOST SECONDARY_HOST_KEY CHECK_HOUR DEAD_AFTER_DAYS ABANDONED_AFTER_DAYS PIHOLE_PASSWORD NOTIFY_URLS; do
            if [ -n "${!v}" ]; then printf '%s=%s\n' "$v" "${!v}" >> stage/agent.env; fi
          done
          printf 'REVISION=%s\nPUBLISH=\nPRIORITY=high-priority\n' "$GITHUB_SHA" > stage/deploy.env

      - name: Ship, build and run
        run: |
          rsync -a --delete --exclude '__pycache__' stage/ "deploy@$AGENT_HOST:staging/$AGENT_NAME/"
          ssh "deploy@$AGENT_HOST" sudo /usr/local/sbin/agent-deploy "$AGENT_NAME"

      - name: Clean up rendered secrets
        if: always()
        run: rm -rf stage
